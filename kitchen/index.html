<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>厨房 | 居楽テック</title>
  <link rel="stylesheet" href="../assets/izakaya-app.css">
</head>
<body data-view="kitchen">
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="../">居楽テック</a>
      <div class="topbar-right">
        <nav class="nav">
          <a href="../order/?table=3" data-i18n="nav_order">注文</a>
          <a class="active" href="../kitchen/" data-i18n="nav_kitchen">厨房</a>

          <button type="button" data-lang="en">🇺🇸 EN</button>
