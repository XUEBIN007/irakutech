<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文 | 本町中華 QR注文</title>
  <link rel="stylesheet" href="../assets/izakaya-app.css?v=20260613-timeout">
</head>
<body data-view="order">
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="../" data-i18n="brand">本町中華 QR注文</a>
      <div class="topbar-right">
        <nav class="nav">
          <a class="active" href="../order/?table=3" data-i18n="nav_order">注文</a>
          <a href="../takeout/" data-i18n="nav_takeout">テイクアウト</a>
          <a href="../kitchen/" data-i18n="nav_kitchen">厨房</a>
          <a href="../checkout/" data-i18n="nav_checkout">会計</a>
          <a href="../admin/" data-i18n="nav_admin">管理</a>
        </nav>
        <div class="lang-switcher" aria-label="Language">
          <button type="button" data-lang="ja">🇯🇵 JP</button>
          <button type="button" data-lang="zh">🇨🇳 中文</button>
          <button type="button" data-lang="en">🇺🇸 EN</button>
        </div>
      </div>
    </header>
    <div class="demo-notice" data-i18n="demo_notice">公開 demo です。入力データはブラウザ内に保存されます。実在する個人情報・決済情報は入力しないでください。</div>
    <main class="page">
      <section class="store-strip">
        <div>
          <strong data-store-name>本町中華食堂（仮）</strong>
          <span data-store-address>船橋市本町エリア</span>
        </div>
        <span data-i18n="course_note">食べ飲み放題は4名様から・ラストオーダー15分前です。</span>
      </section>
      <div class="page-head">
        <div>
          <div class="eyebrow" data-i18n="order_eyebrow">Customer Ordering</div>
          <h1 class="title" data-table-label>テーブル 3</h1>
          <p class="muted" data-i18n="order_desc">メニューを選んで、そのまま厨房へ送信できます。</p>
        </div>
        <a class="app-link" href="../kitchen/" data-i18n="order_to_kitchen">厨房で確認 →</a>
      </div>
      <div class="grid layout-two">
        <section>
          <div class="category-bar" data-categories></div>
          <div class="grid menu-grid" data-menu></div>
        </section>
        <aside class="card pay-panel">
          <h2 data-i18n="cart_title">現在の注文</h2>
          <div data-cart></div>
          <div class="summary"><span data-i18n="total">合計</span><span data-total>¥0</span></div>
          <button class="btn primary" data-submit style="width:100%;margin-top:14px" data-i18n="order_submit">注文を送信</button>
          <div class="order-history">
            <div class="section-head">
              <h2 data-i18n="ordered_title">注文済み</h2>
              <span class="status done" data-order-count>0</span>
            </div>
            <div data-open-orders></div>
            <div class="summary compact"><span data-i18n="current_due">現在のご利用額</span><span data-open-total>¥0</span></div>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <script src="../assets/izakaya-core.js?v=20260613-timeout"></script>
  <script src="../assets/izakaya-config.js?v=20260613-timeout"></script>
  <script src="../assets/izakaya-cloud.js?v=20260613-timeout"></script>
  <script src="../assets/izakaya-i18n.js?v=20260613-timeout"></script>
  <script src="../assets/izakaya-ui.js?v=20260613-timeout"></script>
</body>
</html>
