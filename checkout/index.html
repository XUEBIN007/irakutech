<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会計 | 居楽テック</title>
  <link rel="stylesheet" href="../assets/izakaya-app.css?v=20260608a">
</head>
<body data-view="checkout">
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="../">居楽テック</a>
      <div class="topbar-right">
        <nav class="nav">
          <a href="../order/?table=3" data-i18n="nav_order">注文</a>
          <a href="../takeout/" data-i18n="nav_takeout">テイクアウト</a>
          <a href="../kitchen/" data-i18n="nav_kitchen">厨房</a>
          <a class="active" href="../checkout/" data-i18n="nav_checkout">会計</a>
          <a href="../admin/" data-i18n="nav_admin">管理</a>
        </nav>
        <div class="lang-switcher" aria-label="Language">
          <button type="button" data-lang="ja">🇯🇵 JP</button>
          <button type="button" data-lang="zh">🇨🇳 中文</button>
          <button type="button" data-lang="en">🇺🇸 EN</button>
        </div>
      </div>
    </header>
    <div class="demo-notice" data-i18n="demo_notice">公開 demo です。入力データはブラウザ内に保存されます。実在する個人情報・決済情報は入力しないでください。</div>
    <main class="page">
      <div class="page-head">
        <div>
          <div class="eyebrow" data-i18n="checkout_eyebrow">Checkout</div>
          <h1 class="title" data-i18n="checkout_title">テーブル会計</h1>
          <p class="muted" data-i18n="checkout_desc">未会計の注文をテーブルごとにまとめて精算します。</p>
        </div>
      </div>
      <section class="card overview-card">
        <div class="section-head">
          <h2 data-i18n="business_overview">今日の営業概況</h2>
          <span class="muted" data-business-date></span>
        </div>
        <div class="overview-grid">
          <div class="overview-tile">
            <span data-i18n="today_orders">今日の注文</span>
            <strong data-today-orders>0</strong>
          </div>
          <div class="overview-tile">
            <span data-i18n="today_sales">今日の売上</span>
            <strong class="price" data-today-sales>¥0</strong>
          </div>
          <div class="overview-tile">
            <span data-i18n="open_amount">未会計金額</span>
            <strong class="price" data-open-amount>¥0</strong>
          </div>
          <div class="overview-tile">
            <span data-i18n="order_mix">注文内訳</span>
            <strong data-order-mix>0 / 0 / 0</strong>
          </div>
        </div>
      </section>
      <div class="grid layout-two">
        <section>
          <div class="tabs" data-tables></div>
          <div class="grid" data-checkout-orders style="margin-top:14px"></div>
          <section class="card outside-checkout">
            <div class="section-head">
              <h2 data-i18n="outside_checkout">外卖・自取未结账</h2>
              <span class="status new" data-outside-count>0</span>
            </div>
            <div class="grid" data-outside-orders></div>
          </section>
          <section class="card table-ops" style="margin-top:16px">
            <div class="section-head">
              <h2 data-i18n="table_operations">テーブル操作</h2>
            </div>
            <form class="field-grid" data-table-ops-form>
              <label class="field"><span data-i18n="category">分類</span><select name="action"><option value="open" data-i18n="open_table">開台</option><option value="transfer" data-i18n="transfer_table">席移動</option><option value="merge" data-i18n="merge_table">テーブル結合</option><option value="clear" data-i18n="clear_table">清台</option></select></label>
              <label class="field"><span data-i18n="from_table">移動元</span><select name="fromTable"></select></label>
              <label class="field"><span data-i18n="to_table">移動先</span><select name="toTable"></select></label>
              <label class="field"><span data-i18n="guest_count">人数</span><input name="guestCount" type="number" min="0" value="2"></label>
              <label class="field full"><span data-i18n="table_note">テーブルメモ</span><input name="note" placeholder="予約名 / 移動理由 / 清掃メモ"></label>
              <button class="btn ghost full" type="submit" data-i18n="table_operations">テーブル操作</button>
            </form>
            <div class="ops-list" data-table-events></div>
          </section>
        </section>
        <aside class="card pay-panel">
          <h2 data-i18n="checkout_panel">会計</h2>
          <label class="field">
            <span data-i18n="payment_method">支払い方法</span>
            <select data-payment-method>
              <option value="cash" data-i18n="pay_cash">現金</option>
              <option value="paypay" data-i18n="pay_paypay">PayPay</option>
              <option value="linepay" data-i18n="pay_linepay">LINE Pay</option>
              <option value="wechatpay" data-i18n="pay_wechatpay">WeChat Pay</option>
              <option value="alipay" data-i18n="pay_alipay">Alipay</option>
              <option value="card" data-i18n="pay_card">クレジットカード</option>
              <option value="qr" data-i18n="pay_qr">その他QR決済</option>
            </select>
          </label>
          <div class="summary"><span data-i18n="checkout_total">請求金額</span><span data-checkout-total>¥0</span></div>
          <p class="muted small-note" data-active-payment-hint data-i18n="checkout_hint_table">桌台结账时，请先选择左侧桌号。</p>
          <label class="field">
            <span data-i18n="received_amount">お預かり</span>
            <input data-received-amount type="number" min="0" step="1" inputmode="numeric" placeholder="10000">
          </label>
          <div class="summary"><span data-i18n="change_amount">お釣り</span><span data-change-total>¥0</span></div>
          <button class="btn primary" data-pay style="width:100%;margin-top:14px" data-i18n="checkout_submit">会計完了・清台</button>
        </aside>
      </div>
      <section class="card close-panel" style="margin-top:16px">
        <div class="section-head">
          <h2 data-i18n="daily_close">日締め</h2>
          <span class="status new" data-close-warning hidden data-i18n="unpaid_warning">未会計があります</span>
        </div>
        <div class="close-grid">
          <div class="overview-grid compact">
            <div class="overview-tile"><span data-i18n="cash_expected">現金予定</span><strong class="price" data-cash-expected>¥0</strong></div>
            <div class="overview-tile"><span data-i18n="cash_difference">現金差額</span><strong class="price" data-cash-difference>¥0</strong></div>
            <div class="overview-tile"><span data-i18n="open_amount">未会計金額</span><strong class="price" data-close-open>¥0</strong></div>
          </div>
          <form class="field-grid" data-close-form>
            <label class="field"><span data-i18n="cash_actual">現金実額</span><input name="cashActual" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label>
            <label class="field"><span data-i18n="close_note">日締めメモ</span><input name="note" placeholder="レジ点検"></label>
            <button class="btn primary full" type="submit" data-i18n="close_business_day">日締め保存</button>
          </form>
        </div>
      </section>
      <section class="card" style="margin-top:16px">
        <div class="section-head">
          <h2 data-i18n="close_history">日締め履歴</h2>
        </div>
        <div class="payment-list" data-close-history></div>
      </section>
      <section class="card" style="margin-top:16px">
        <div class="section-head">
          <h2 data-i18n="payment_history">收款记录</h2>
          <strong class="price" data-payment-total>¥0</strong>
        </div>
        <div class="payment-list" data-payment-history></div>
      </section>
    </main>
  </div>
  <script src="../assets/izakaya-core.js?v=20260608a"></script>
  <script src="../assets/izakaya-config.js?v=20260608a"></script>
  <script src="../assets/izakaya-cloud.js?v=20260608a"></script>
  <script src="../assets/izakaya-i18n.js?v=20260608a"></script>
  <script src="../assets/izakaya-ui.js?v=20260608a"></script>
</body>
</html>
